name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed to publish the rolling release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # BepInEx is freely redistributable, so CI fetches it rather than committing it.
      - name: Fetch BepInEx
        shell: pwsh
        run: |
          $url = 'https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.3/BepInEx_win_x64_5.4.23.3.zip'
          Invoke-WebRequest -Uri $url -OutFile bepinex.zip -UseBasicParsing
          Expand-Archive -Path bepinex.zip -DestinationPath bepinex -Force

      # The game's assemblies can't be shipped, so the build uses the stripped reference copies
      # in refs/Managed (regenerate with refs/update-refs.ps1). They carry metadata only.
      - name: Build
        shell: pwsh
        run: |
          dotnet build RestoryTweaks/RestoryTweaks.csproj -c Release --nologo `
            -p:ManagedDir="$PWD/refs/Managed" `
            -p:BepInExCore="$PWD/bepinex/BepInEx/core"

      - uses: actions/upload-artifact@v4
        with:
          name: RestoryTweaks
          path: RestoryTweaks/bin/Release/RestoryTweaks.dll

      # Every push to main refreshes the "latest" release, so the one-line installer always fetches
      # the current build.
      #
      # Updated in place rather than deleted and recreated. Recreating opened a window where the
      # release did not exist, and during it the API's "latest release" silently fell back to the
      # older v0.1.0 tag - so the installer reported success while installing a stale DLL. It also
      # left the new release stuck in draft, since the tag it referenced had just been removed.
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = "${{ github.sha }}".Substring(0,7)
          $dll = "RestoryTweaks/bin/Release/RestoryTweaks.dll"

          $notes = @"
          Automatic build of ${{ github.sha }}.

          **Steam Deck / Linux**

              curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/install-steamdeck.sh | bash

          **Windows** - unzip BepInEx 5 (x64) into the game folder and drop RestoryTweaks.dll into BepInEx/plugins/.
          "@
          Set-Content -Path notes.md -Value $notes -Encoding utf8

          # Point the rolling tag at this commit, creating the release the first time only.
          git tag -f latest "${{ github.sha }}"
          git push -f origin latest

          gh release view latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --title "Latest build ($sha)" --notes-file notes.md --latest
            if ($LASTEXITCODE -ne 0) { throw "could not create the latest release" }
          }

          gh release upload latest $dll --clobber
          if ($LASTEXITCODE -ne 0) { throw "could not upload $dll" }

          # --draft=false matters: a release left in draft is invisible to the download URL the
          # installer uses, which fails as an unhelpful 404.
          gh release edit latest --title "Latest build ($sha)" --notes-file notes.md --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "could not update the latest release" }

          # Prove the asset is actually reachable anonymously, the way the installer fetches it.
          $url = "https://github.com/${{ github.repository }}/releases/download/latest/RestoryTweaks.dll"
          $expected = (Get-Item $dll).Length
          Invoke-WebRequest -Uri $url -OutFile check.dll -UseBasicParsing
          $got = (Get-Item check.dll).Length
          if ($got -ne $expected) { throw "published asset is $got bytes, expected $expected" }
          Write-Host "Published $expected bytes to $url"
